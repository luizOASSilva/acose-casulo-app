worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Evita cache em HTML/API/respostas dinâmicas
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Assets estáticos
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
            access_log off;
        }

        # Segurança: nunca executar PHP dentro do storage público
        location ~* ^/storage/.*\.php$ {
            deny all;
        }

        location ~ \.php$ {
            try_files $uri =404;

            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;

            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
        }

        location ~ /\. {
            deny all;
        }

        location ~* \.(env|log|sql|sqlite|bak|old|swp)$ {
            deny all;
        }
    }
}
